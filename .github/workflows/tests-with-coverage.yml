name: Testes com Coverage

on:
  push:
    branches: [ main, staging, bkp ]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Run integration tests
        run: dotnet test tests/IntegrationTests/MBA.Educacao.Online.IntegrationTests.csproj

      - name: Run unit tests with coverage
        run: >
          dotnet test
          tests/UnitTests/MBA.Educacao.Online.UnitTests.csproj
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/coverage

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage reports
        shell: pwsh
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          reportgenerator `
            "-reports:TestResults/coverage/**/coverage.cobertura.xml" `
            "-targetdir:TestResults/coverage/report" `
            "-reporttypes:Html;Cobertura"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/coverage/report

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: TestResults/coverage/report/Cobertura.xml
          flags: unit-tests
          fail_ci_if_error: true